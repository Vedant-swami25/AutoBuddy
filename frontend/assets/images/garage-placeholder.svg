<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="12" fill="#1a1a2e"/>
  <rect x="100" y="80" width="200" height="140" rx="8" fill="#16213e" stroke="#0f3460" stroke-width="2"/>
  <!-- Garage door -->
  <rect x="140" y="130" width="120" height="90" rx="4" fill="#0f3460"/>
  <line x1="170" y1="130" x2="170" y2="220" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="200" y1="130" x2="200" y2="220" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="230" y1="130" x2="230" y2="220" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="140" y1="155" x2="260" y2="155" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="140" y1="180" x2="260" y2="180" stroke="#1a1a2e" stroke-width="1.5"/>
  <line x1="140" y1="205" x2="260" y2="205" stroke="#1a1a2e" stroke-width="1.5"/>
  <!-- Roof -->
  <polygon points="80,80 200,30 320,80" fill="#e94560" opacity="0.9"/>
  <!-- Wrench icon -->
  <circle cx="200" cy="170" r="18" fill="none" stroke="#e94560" stroke-width="2.5" opacity="0.8"/>
  <line x1="187" y1="183" x2="175" y2="195" stroke="#e94560" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <!-- Text -->
  <text x="200" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#7f8c8d" letter-spacing="2">AUTOBUDDY WORKSHOP</text>
